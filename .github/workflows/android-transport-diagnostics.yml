name: Android native transport diagnostic (one boot)

'on':
  push:
    branches: [diagnostic/home-adb-transport-a421]

permissions:
  contents: read

jobs:
  transport:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ADB_TRACE: adb,transport
      ANDROID_ADB_LOG_PATH: ${{ runner.temp }}/home-adb-transport-native.log
      TRANSPORT_OUTPUT_DIR: ${{ github.workspace }}/transport-diagnostics
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Guard one attempt and exact isolated parent
        run: |
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git rev-parse HEAD^)" = 95dc606b24b538e58bed51f756b79324f5d35abe

      - name: Checkout original runner without modifying it
        uses: actions/checkout@v5
        with:
          repository: ReactiveCircus/android-emulator-runner
          ref: a421e43855164a8197daf9d8d40fe71c6996bb0d
          path: .ci-transport-runner
          persist-credentials: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Enable original hardware acceleration
        run: |
          sudo chown "$USER":kvm /dev/kvm
          sudo chmod 660 /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm

      - name: Archive unmodified source and arm native logging before launch
        run: |
          mkdir -p "$TRANSPORT_OUTPUT_DIR"
          git rev-parse HEAD HEAD^ HEAD^{tree} > "$TRANSPORT_OUTPUT_DIR/diagnostic-commit.txt"
          python3 .github/scripts/retain-android-transport.py prepare .ci-transport-runner

      - name: Original startup and MENU with native host transport logging
        id: startup
        uses: ./.ci-transport-runner
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_6
          emulator-build: '16740729'
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          emulator-boot-timeout: 600
          disable-animations: true
          disable-linux-hw-accel: false
          script: node -e 'console.log("Transport diagnostic only; no application build or tests.")'

      - name: Retain native server log and identities without calling adb
        if: always()
        env:
          ORIGINAL_ACTION_OUTCOME: ${{ steps.startup.outcome }}
        run: python3 .github/scripts/retain-android-transport.py collect .ci-transport-runner

      - name: Upload available native evidence even on startup failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-native-transport-a421
          path: transport-diagnostics/
          if-no-files-found: error
          retention-days: 3
